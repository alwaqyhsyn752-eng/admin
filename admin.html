<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOIR | لوحة الإدارة</title>
<style>
:root{--black:#101722;--navy:#1B2938;--gold:#C6A66A;--gold2:#b59559;--ivory:#F1EBDD;--emerald:#527D70;--gray:#A5ABB4;--line:rgba(198,166,106,0.18);--card:rgba(27,41,56,0.55)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Tajawal',system-ui,sans-serif;background:#0a1018;background-image:radial-gradient(circle at 50% 0%,#1B2938 0%,#101722 55%,#0a1018 100%);background-attachment:fixed;color:var(--ivory);direction:rtl;min-height:100vh;padding-bottom:80px;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.6}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit}
a{text-decoration:none;color:inherit}
input::placeholder,textarea::placeholder{color:var(--gray)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--gold);border-radius:3px}
.hidden{display:none !important}
.gold{color:var(--gold)}
.header{position:sticky;top:0;z-index:100;background:rgba(16,23,34,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--line);padding:14px 16px}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.brand-mark{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--gold),var(--gold2));display:grid;place-items:center;font-size:18px;font-weight:900;color:var(--black);box-shadow:0 4px 14px rgba(198,166,106,0.35);flex-shrink:0}
.brand-name{font-size:16px;font-weight:800;color:var(--ivory);display:block;letter-spacing:0.5px}
.brand-tag{font-size:9px;color:var(--gold);letter-spacing:2px;text-transform:uppercase}
.hdr-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:42px;height:42px;border-radius:11px;background:rgba(198,166,106,0.08);border:1px solid var(--line);display:grid;place-items:center;color:var(--gold);position:relative;transition:all .25s}
.icon-btn:hover{background:rgba(198,166,106,0.18)}
.icon-btn svg{width:20px;height:20px}
.cart-badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;background:var(--gold);color:var(--black);font-size:10px;font-weight:800;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.search{position:relative}
.search input{width:100%;height:44px;background:rgba(16,23,34,0.7);border:1px solid var(--line);border-radius:11px;padding:0 42px 0 14px;color:var(--ivory);font-size:14px;transition:all .25s}
.search input:focus{outline:none;border-color:var(--gold);background:rgba(16,23,34,0.95);box-shadow:0 0 0 3px rgba(198,166,106,0.1)}
.search svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--gold);pointer-events:none}
.cats{padding:14px 16px;overflow-x:auto;white-space:nowrap;border-bottom:1px solid var(--line);background:rgba(16,23,34,0.35);scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{display:inline-flex;flex-direction:column;align-items:center;gap:6px;padding:10px 16px;background:rgba(27,41,56,0.6);border:1px solid var(--line);border-radius:12px;margin-left:8px;font-size:12px;font-weight:500;color:var(--gray);transition:all .25s;min-width:74px}
.cat.active{background:var(--gold);color:var(--black);border-color:var(--gold);font-weight:700}
.cat svg{width:22px;height:22px}
main{padding:0}
.hero{margin:16px;border-radius:20px;overflow:hidden;position:relative;height:240px;border:1px solid var(--line);box-shadow:0 20px 40px rgba(0,0,0,0.5)}
.hero img{width:100%;height:100%;object-fit:cover}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to left,rgba(16,23,34,0.95) 0%,rgba(16,23,34,0.4) 60%,rgba(16,23,34,0.1) 100%)}
.hero-content{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:28px}
.hero-tag{font-size:11px;color:var(--gold);letter-spacing:3px;margin-bottom:8px;font-weight:700}
.hero-title{font-size:30px;font-weight:900;color:var(--ivory);margin-bottom:14px;line-height:1.2;text-shadow:0 2px 10px rgba(0,0,0,0.5)}
.hero-btn{background:var(--gold);color:var(--black);padding:11px 24px;border-radius:24px;font-weight:800;font-size:13px;width:fit-content;transition:all .25s}
.hero-btn:hover{background:var(--gold2);transform:translateY(-2px);box-shadow:0 8px 24px rgba(198,166,106,0.4)}
.section-head{padding:24px 16px 14px;display:flex;align-items:center;gap:14px}
.section-head h2{font-size:19px;font-weight:800;color:var(--ivory);white-space:nowrap}
.section-head .line{flex:1;height:1px;background:linear-gradient(to left,var(--line),transparent)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 16px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(4,1fr);padding:0 32px;gap:16px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:all .35s cubic-bezier(.175,.885,.32,1.275);display:flex;flex-direction:column;backdrop-filter:blur(10px)}
.card:hover{transform:translateY(-6px);box-shadow:0 15px 35px rgba(0,0,0,0.5),0 0 0 1px var(--gold)}
.card-img{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--black)}
.card-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card:hover .card-img img{transform:scale(1.08)}
.badge{position:absolute;top:8px;right:8px;padding:4px 10px;border-radius:16px;font-size:10px;font-weight:800;letter-spacing:.5px}
.badge.new{background:var(--ivory);color:var(--black)}
.badge.offer{background:var(--emerald);color:var(--ivory)}
.badge.out{background:rgba(231,76,60,0.95);color:#fff;top:auto;bottom:8px;right:8px}
.card-info{padding:12px;display:flex;flex-direction:column;flex:1;gap:4px}
.card-name{font-size:13px;font-weight:700;color:var(--ivory);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.card-price{display:flex;align-items:baseline;gap:6px;margin:2px 0 6px}
.price-now{color:var(--gold);font-size:15px;font-weight:800}
.price-old{color:var(--gray);font-size:11px;text-decoration:line-through}
.card-btn{margin-top:auto;padding:9px;background:transparent;border:1px solid var(--gold);border-radius:9px;color:var(--gold);font-weight:700;font-size:12px;transition:all .25s;display:flex;align-items:center;justify-content:center;gap:5px}
.card-btn:hover{background:var(--gold);color:var(--black)}
.card-btn:disabled{opacity:.35;cursor:not-allowed;background:transparent;color:var(--gray);border-color:var(--gray)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(16,23,34,0.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 0 calc(10px + env(safe-area-inset-bottom));z-index:100}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--gray);padding:4px 16px;background:none;transition:all .25s;font-weight:500}
.nav-item svg{width:22px;height:22px;transition:transform .25s}
.nav-item.active{color:var(--gold);font-weight:700}
.nav-item.active svg{transform:translateY(-2px)}
</style>
</head>
<body>


<!-- شريط الحالة العلوي -->
<div class="status-bar" id="statusBar">
  <h4 id="statusTitle">جاري المعالجة...</h4>
  <p id="statusMsg"></p>
</div>

<!-- ============ صفحة الإدارة ============ -->
<div class="page active" id="pageAdmin">
  <header class="header">
    <div class="header-top">
      <div class="brand">
        <div class="brand-mark">A</div>
        <div><span class="brand-name">لوحة الإدارة</span><span class="brand-tag">Admin Panel</span></div>
      </div>
      <button class="icon-btn" onclick="App.go('store')">✕</button>
    </div>
  </header>
  <div id="adminContent"></div>
</div>

<!-- ============ Modal: تفاصيل المنتج ============ -->
<div class="modal" id="productModal" onclick="if(event.target===this)Store.closeProduct()">
  <div class="modal-box" id="productModalBox"></div>
</div>

<!-- ============ Modal: السلة ============ -->
<div class="modal" id="cartModal" onclick="if(event.target===this)Store.closeCart()">
  <div class="modal-box" id="cartBox"></div>
</div>

<!-- ============ Modal: عام (تسجيل/إتمام طلب/نموذج منتج) ============ -->
<div class="modal" id="genericModal" onclick="if(event.target===this)App.closeModal()">
  <div class="modal-box" id="genericBox"></div>
</div>

<div class="toast" id="toast"></div>


<script>

// ==================== قاعدة البيانات (localStorage) ====================
const DB = {
  get(k, def) { try { const v = localStorage.getItem('noir_'+k); return v ? JSON.parse(v) : def; } catch(e) { return def; } },
  set(k, v) { localStorage.setItem('noir_'+k, JSON.stringify(v)); },
  del(k) { localStorage.removeItem('noir_'+k); }
};

// ==================== البيانات الافتراضية ====================
function seedIfEmpty() {
  if (!DB.get('products')) {
    const defs = [
      {id:'p1',name:'ساعة فاخرة كلاسيك',price:1299,oldPrice:1599,cat:'watches',stock:12,status:'offer',rating:4.9,desc:'ساعة سويسرية بسوار جلد إيطالي أصلي، حركة كوارتز يابانية، مقاومة للماء 50 متر.',images:[svgImg('WATCH 1','#1B2938','#C6A66A'),svgImg('WATCH 2','#101722','#C6A66A')]},
      {id:'p2',name:'عطر NOIR Signature',price:599,oldPrice:null,cat:'perfumes',stock:25,status:'new',rating:4.8,desc:'عطر شرقي فاخر بمزيج من العود والمسك والعنبر. ثبات يدوم 12 ساعة.',images:[svgImg('NOIR','#101722','#C6A66A')]},
      {id:'p3',name:'حقيبة جلد فاخرة',price:899,oldPrice:1199,cat:'bags',stock:8,status:'offer',rating:4.7,desc:'حقيبة يد جلد طبيعي، تصميم عصري، مساحة واسعة، أحزمة قابلة للتعديل.',images:[svgImg('BAG','#1B2938','#C6A66A')]},
      {id:'p4',name:'نظارة شمسية برو',price:459,oldPrice:null,cat:'accessories',stock:30,status:'new',rating:4.6,desc:'نظارة شمسية بإطار معدني خفيف وعدسات مضادة للأشعة فوق البنفسجية.',images:[svgImg('SUNGLASSES','#101722','#C6A66A')]},
      {id:'p5',name:'محفظة جلد رجالية',price:249,oldPrice:349,cat:'bags',stock:40,status:'offer',rating:4.5,desc:'محفظة جلد طبيعي بحجم صغير، تصميم كلاسيكي أنيق مع 8 جيوب للبطاقات.',images:[svgImg('WALLET','#1B2938','#C6A66A')]},
      {id:'p6',name:'قلم فاخر ذهبي',price:189,oldPrice:null,cat:'accessories',stock:15,status:'normal',rating:4.4,desc:'قلم حبر فاخر بطلاء ذهبي، تصميم كلاسيكي مناسب للهدايا الرسمية.',images:[svgImg('PEN','#101722','#C6A66A')]}
    ];
    DB.set('products', defs);
  }
  if (!DB.get('categories')) {
    DB.set('categories', [
      {id:'all',name:'الكل',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>'},
      {id:'watches',name:'ساعات',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="6" width="12" height="12" rx="6"/><path d="M9 2h6l-1 4"/><path d="M9 22h6l-1-4"/></svg>'},
      {id:'perfumes',name:'عطور',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="7" y="9" width="10" height="12" rx="2"/><path d="M9 9V6a3 3 0 0 1 3-3 3 3 0 0 1 3 3v3"/></svg>'},
      {id:'bags',name:'حقائب',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h16l-1.5 12H5.5L4 8z"/><path d="M9 8V5a3 3 0 0 1 6 0v3"/></svg>'},
      {id:'accessories',name:'إكسسوارات',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="12" r="3"/><circle cx="16" cy="12" r="3"/><path d="M11 12h2"/></svg>'}
    ]);
  }
  if (!DB.get('settings')) {
    DB.set('settings', {storeName:'NOIR',currency:'ر.س',adminPass:'1234'});
  }
}

function svgImg(txt, bg, color) {
  const s = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="'+(bg||'#1B2938')+'"/><stop offset="100%" stop-color="#0a1018"/></linearGradient></defs><rect width="400" height="500" fill="url(#g)"/><text x="200" y="270" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="'+(color||'#C6A66A')+'" opacity="0.9">'+txt+'</text></svg>';
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
}

// ==================== أدوات ====================
const $ = id => document.getElementById(id);
function toast(msg, type) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type||'');
  clearTimeout(t._t);
  t._t = setTimeout(() => { t.className = 'toast'; }, 2800);
}

// ==================== App Router ====================
const App = {
  go(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    const el = $('page' + (page.charAt(0).toUpperCase() + page.slice(1)));
    if (el) el.classList.add('active');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    window.scrollTo(0,0);
    
    if (page === 'admin') Admin.render();
    if (page === 'store') { window.location.href = '../store/index.html'; return; }
  },
  closeModal() { $('genericModal').classList.remove('open'); },
  showModal(html) { $('genericBox').innerHTML = html; $('genericModal').classList.add('open'); }
};

// ==================== Store ====================

// ==================== Accounts ====================

// ==================== Admin ====================
const Admin = {
  authed: false,
  tab: 'dashboard',

  render() {
    if (!this.authed) return this.showLock();
    this.renderPanel();
  },

  showLock() {
    $('adminContent').innerHTML =
      '<div class="lock-wrap"><div class="lock-box">' +
      '<div class="lock-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>' +
      '<h2 class="product-title" style="text-align:center;margin-bottom:6px">لوحة الإدارة</h2>' +
      '<p style="text-align:center;color:var(--gray);font-size:12px;margin-bottom:16px">أدخل كلمة المرور للمتابعة (افتراضي: 1234)</p>' +
      '<div class="form-group"><input class="form-input" type="password" id="adminPass" placeholder="••••"></div>' +
      '<button class="btn-full" onclick="Admin.unlock()">دخول</button>' +
      '</div></div>';
  },

  unlock() {
    const p = $('adminPass').value;
    const settings = DB.get('settings', {});
    if (p === (settings.adminPass || '1234')) {
      this.authed = true;
      this.renderPanel();
    } else toast('كلمة المرور خاطئة', 'err');
  },

  renderPanel() {
    const stats = this.getStats();
    $('adminContent').innerHTML =
      '<div class="admin-wrap">' +
      '<div class="admin-head"><h1 class="admin-title">مرحباً</h1><button class="btn-sm btn-gold" onclick="Admin.authed=false;App.go(\'store\')">خروج</button></div>' +
      '<div class="admin-tabs">' +
      ['dashboard|📊 الملخص', 'products|📦 المنتجات', 'orders|🛒 الطلبات', 'users|👥 العملاء', 'studio|🎨 AI Studio', 'settings|⚙️ الإعدادات'].map(t => {
        const [k, l] = t.split('|');
        return '<button class="admin-tab ' + (this.tab === k ? 'active' : '') + '" onclick="Admin.tab=\'' + k + '\';Admin.renderPanel()">' + l + '</button>';
      }).join('') +
      '</div>' +
      '<div id="adminTabContent"></div>' +
      '</div>';
    this.renderTabContent(stats);
  },

  getStats() {
    return {
      products: (DB.get('products',[])||[]).length,
      orders: (DB.get('orders',[])||[]).length,
      users: (DB.get('users',[])||[]).length,
      lowStock: (DB.get('products',[])||[]).filter(p => p.stock > 0 && p.stock <= 5).length,
      revenue: (DB.get('orders',[])||[]).reduce((s,o) => s + (o.total||0), 0)
    };
  },

  renderTabContent(stats) {
    const c = $('adminTabContent');
    if (this.tab === 'dashboard') {
      c.innerHTML =
        '<div class="stat-grid">' +
        '<div class="stat"><div class="stat-label">المنتجات</div><div class="stat-val">' + stats.products + '</div></div>' +
        '<div class="stat"><div class="stat-label">الطلبات</div><div class="stat-val">' + stats.orders + '</div></div>' +
        '<div class="stat"><div class="stat-label">العملاء</div><div class="stat-val">' + stats.users + '</div></div>' +
        '<div class="stat"><div class="stat-label">الإيراد</div><div class="stat-val">' + stats.revenue + '</div></div>' +
        '</div>' +
        (stats.lowStock ? '<div class="panel" style="border-color:#f59e0b"><h3 style="color:#f59e0b">⚠️ ' + stats.lowStock + ' منتج بمخزون منخفض</h3></div>' : '') +
        '<div class="panel"><h3>إجراءات سريعة</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn-sm btn-gold" onclick="Admin.tab=\'products\';Admin.newProduct()">+ منتج جديد</button><button class="btn-sm btn-edit" onclick="Admin.tab=\'studio\';Admin.renderPanel()">🎨 استوديو AI</button></div></div>';
    }
    if (this.tab === 'products') this.renderProductsTab(c);
    if (this.tab === 'orders') this.renderOrdersTab(c);
    if (this.tab === 'users') this.renderUsersTab(c);
    if (this.tab === 'studio') this.renderStudioTab(c);
    if (this.tab === 'settings') this.renderSettingsTab(c);
  },

  renderProductsTab(c) {
    const prods = DB.get('products',[]);
    c.innerHTML = '<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="margin:0">المنتجات (' + prods.length + ')</h3><button class="btn-sm btn-gold" onclick="Admin.newProduct()">+ إضافة</button></div>' +
      prods.map(p => '<div class="row-item"><img src="' + ((p.images&&p.images[0])||svgImg(p.name.slice(0,10))) + '"><div class="row-info"><div class="row-title">' + p.name + '</div><div class="row-sub">' + p.price + ' ر.س • مخزون: ' + (p.stock||0) + '</div></div><button class="btn-sm btn-edit" onclick="Admin.editProduct(\'' + p.id + '\')">تعديل</button><button class="btn-sm btn-del" onclick="Admin.delProduct(\'' + p.id + '\')">حذف</button></div>').join('') +
      '</div>';
  },

  newProduct() {
    App.showModal(
      '<button class="close-x" onclick="App.closeModal()">✕</button>' +
      '<h2 class="product-title" style="margin-bottom:14px">منتج جديد</h2>' +
      '<div class="form-group"><label class="form-label">الاسم</label><input class="form-input" id="pfName" placeholder="اسم المنتج"></div>' +
      '<div class="form-group"><label class="form-label">الوصف</label><textarea class="form-input" id="pfDesc" placeholder="وصف تفصيلي"></textarea></div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="form-group"><label class="form-label">السعر</label><input class="form-input" id="pfPrice" type="number" placeholder="0"></div><div class="form-group"><label class="form-label">السعر القديم</label><input class="form-input" id="pfOld" type="number" placeholder="اختياري"></div></div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="form-group"><label class="form-label">المخزون</label><input class="form-input" id="pfStock" type="number" value="10"></div><div class="form-group"><label class="form-label">القسم</label><select class="form-input" id="pfCat">' + DB.get('categories',[]).filter(x=>x.id!=='all').map(x=>'<option value="'+x.id+'">'+x.name+'</option>').join('') + '</select></div></div>' +
      '<div class="form-group"><label class="form-label">الحالة</label><select class="form-input" id="pfStatus"><option value="normal">عادي</option><option value="new">جديد</option><option value="offer">عرض</option></select></div>' +
      '<div class="form-group"><label class="form-label">رابط صورة (اختياري)</label><input class="form-input" id="pfImg" type="url" placeholder="https://..."></div>' +
      '<div class="form-group"><label class="form-label">رابط فيديو (اختياري)</label><input class="form-input" id="pfVideo" type="url" placeholder="https://...mp4"></div>' +
      '<button class="btn-full" onclick="Admin.saveProduct()">حفظ المنتج ✓</button>'
    );
  },

  editProduct(id) {
    const p = DB.get('products',[]).find(x => x.id === id);
    if (!p) return;
    App.showModal(
      '<button class="close-x" onclick="App.closeModal()">✕</button>' +
      '<h2 class="product-title" style="margin-bottom:14px">تعديل: ' + p.name + '</h2>' +
      '<div class="form-group"><label class="form-label">الاسم</label><input class="form-input" id="pfName" value="' + (p.name||'').replace(/"/g,'&quot;') + '"></div>' +
      '<div class="form-group"><label class="form-label">الوصف</label><textarea class="form-input" id="pfDesc">' + (p.desc||'') + '</textarea></div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="form-group"><label class="form-label">السعر</label><input class="form-input" id="pfPrice" type="number" value="' + p.price + '"></div><div class="form-group"><label class="form-label">السعر القديم</label><input class="form-input" id="pfOld" type="number" value="' + (p.oldPrice||'') + '"></div></div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="form-group"><label class="form-label">المخزون</label><input class="form-input" id="pfStock" type="number" value="' + (p.stock||0) + '"></div><div class="form-group"><label class="form-label">القسم</label><select class="form-input" id="pfCat">' + DB.get('categories',[]).filter(x=>x.id!=='all').map(x=>'<option value="'+x.id+'" '+(x.id===p.cat?'selected':'')+'>'+x.name+'</option>').join('') + '</select></div></div>' +
      '<div class="form-group"><label class="form-label">الحالة</label><select class="form-input" id="pfStatus"><option value="normal" '+(p.status==='normal'?'selected':'')+'>عادي</option><option value="new" '+(p.status==='new'?'selected':'')+'>جديد</option><option value="offer" '+(p.status==='offer'?'selected':'')+'>عرض</option></select></div>' +
      '<div class="form-group"><label class="form-label">صورة</label><input class="form-input" id="pfImg" type="url" value="' + ((p.images&&p.images[0])||'') + '"></div>' +
      '<div class="form-group"><label class="form-label">فيديو</label><input class="form-input" id="pfVideo" type="url" value="' + (p.video||'') + '"></div>' +
      '<button class="btn-full" onclick="Admin.saveProduct(\'' + id + '\')">حفظ التعديلات ✓</button>'
    );
  },

  saveProduct(id) {
    const name = $('pfName').value.trim();
    const desc = $('pfDesc').value.trim();
    const price = parseFloat($('pfPrice').value) || 0;
    const oldPrice = parseFloat($('pfOld').value) || null;
    const stock = parseInt($('pfStock').value) || 0;
    const cat = $('pfCat').value;
    const status = $('pfStatus').value;
    const img = $('pfImg').value.trim();
    const video = $('pfVideo').value.trim();
    if (!name || !price) return toast('الاسم والسعر مطلوبان', 'err');
    const prods = DB.get('products',[]);
    if (id) {
      const p = prods.find(x => x.id === id);
      if (p) {
        p.name = name; p.desc = desc; p.price = price; p.oldPrice = oldPrice;
        p.stock = stock; p.cat = cat; p.status = status; p.video = video || null;
        if (img) p.images = [img];
      }
    } else {
      prods.unshift({
        id: 'p' + Date.now(), name, desc, price, oldPrice, stock, cat, status,
        images: [img || svgImg(name.slice(0,10))], video: video || null, rating: 4.5
      });
    }
    DB.set('products', prods);
    App.closeModal();
    toast('تم الحفظ ✓', 'ok');
    this.renderPanel();
  },

  delProduct(id) {
    if (!confirm('حذف هذا المنتج؟')) return;
    DB.set('products', DB.get('products',[]).filter(x => x.id !== id));
    toast('تم الحذف');
    this.renderPanel();
  },

  renderOrdersTab(c) {
    const orders = DB.get('orders',[]);
    c.innerHTML = '<div class="panel"><h3>الطلبات (' + orders.length + ')</h3>' +
      (orders.length ? orders.map(o => '<div class="row-item" style="flex-direction:column;align-items:flex-start;padding:12px"><div style="width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><div class="row-title">' + o.id + '</div><select class="form-input" style="width:auto;padding:4px 8px;font-size:11px" onchange="Admin.updateOrderStatus(\'' + o.id + '\',this.value)"><option ' + (o.status==='جديد'?'selected':'') + '>جديد</option><option ' + (o.status==='قيد التجهيز'?'selected':'') + '>قيد التجهيز</option><option ' + (o.status==='مشحون'?'selected':'') + '>مشحون</option><option ' + (o.status==='مكتمل'?'selected':'') + '>مكتمل</option></select></div><div class="row-sub">' + o.user.name + ' • ' + o.user.phone + '</div><div class="row-sub">' + o.items.length + ' منتج • ' + o.total + ' ر.س</div><div class="row-sub" style="color:var(--gold)">' + o.user.address + '</div></div>').join('') : '<p style="color:var(--gray);text-align:center;padding:20px">لا توجد طلبات</p>') + '</div>';
  },

  updateOrderStatus(id, status) {
    const orders = DB.get('orders',[]);
    const o = orders.find(x => x.id === id);
    if (o) { o.status = status; DB.set('orders', orders); toast('تم التحديث ✓', 'ok'); }
  },

  renderUsersTab(c) {
    const users = DB.get('users',[]);
    c.innerHTML = '<div class="panel"><h3>العملاء (' + users.length + ')</h3>' +
      (users.length ? users.map(u => '<div class="row-item"><div class="row-info"><div class="row-title">' + u.name + (u.blocked?' <span style="color:#e74c3c;font-size:10px">(محظور)</span>':'') + '</div><div class="row-sub">' + u.email + '</div></div><button class="btn-sm ' + (u.blocked?'btn-ok':'btn-del') + '" onclick="Admin.toggleBlock(\'' + u.id + '\')">' + (u.blocked?'إلغاء':'حظر') + '</button></div>').join('') : '<p style="color:var(--gray);text-align:center;padding:20px">لا يوجد عملاء</p>') + '</div>';
  },

  toggleBlock(id) {
    const users = DB.get('users',[]);
    const u = users.find(x => x.id === id);
    if (u) { u.blocked = !u.blocked; DB.set('users', users); this.renderPanel(); }
  },

  renderStudioTab(c) {
    c.innerHTML = '<div class="panel"><h3>🎨 AI Product Studio — تحرير الصور</h3>' +
      '<p style="color:var(--gray);font-size:12px;margin-bottom:12px">ارفع صورة منتج، عدلها، احفظها ثم أضف رابطها للمنتج.</p>' +
      '<div class="form-group"><label class="form-label">رفع صورة</label><input type="file" id="studioUpload" accept="image/*" style="color:var(--ivory)"></div>' +
      '<div class="editor-grid" id="studioEditor" style="display:none">' +
      '<div class="canvas-wrap"><canvas id="studioCanvas"></canvas></div>' +
      '<div>' +
      '<div class="slider-row"><label><span>السطوع</span><span id="vBright">100%</span></label><input type="range" id="sBright" min="0" max="200" value="100"></div>' +
      '<div class="slider-row"><label><span>التباين</span><span id="vContrast">100%</span></label><input type="range" id="sContrast" min="0" max="200" value="100"></div>' +
      '<div class="slider-row"><label><span>التشبع</span><span id="vSat">100%</span></label><input type="range" id="sSat" min="0" max="200" value="100"></div>' +
      '<div class="slider-row"><label><span>الدوران</span><span id="vRot">0°</span></label><input type="range" id="sRot" min="0" max="360" value="0"></div>' +
      '<div class="form-group" style="margin-top:10px"><label class="form-label">الخلفية</label><div class="bg-picker">' +
      '<div class="bg-swatch active" data-bg="#101722" style="background:#101722"></div>' +
      '<div class="bg-swatch" data-bg="#1B2938" style="background:#1B2938"></div>' +
      '<div class="bg-swatch" data-bg="#F1EBDD" style="background:#F1EBDD"></div>' +
      '<div class="bg-swatch" data-bg="#ffffff" style="background:#fff"></div>' +
      '</div></div>' +
      '<button class="btn-full" style="margin-top:12px" onclick="Studio.save()">💾 حفظ الصورة</button>' +
      '</div></div></div>';
    Studio.init();
  },

  renderSettingsTab(c) {
    const s = DB.get('settings', {});
    c.innerHTML = '<div class="panel"><h3>إعدادات المتجر</h3>' +
      '<div class="form-group"><label class="form-label">اسم المتجر</label><input class="form-input" id="setName" value="' + (s.storeName||'NOIR') + '"></div>' +
      '<div class="form-group"><label class="form-label">العملة</label><input class="form-input" id="setCurrency" value="' + (s.currency||'ر.س') + '"></div>' +
      '<div class="form-group"><label class="form-label">كلمة مرور الإدارة</label><input class="form-input" id="setPass" value="' + (s.adminPass||'1234') + '"></div>' +
      '<button class="btn-full" onclick="Admin.saveSettings()">حفظ ✓</button></div>' +
      '<div class="panel" style="border-color:#e74c3c"><h3 style="color:#e74c3c">⚠️ منطقة الخطر</h3>' +
      '<p style="color:var(--gray);font-size:12px;margin-bottom:10px">حذف جميع البيانات وإعادة تعيين المتجر.</p>' +
      '<button class="btn-sm btn-del" onclick="Admin.factoryReset()">🗑️ حذف كل شيء</button></div>';
  },

  saveSettings() {
    const s = DB.get('settings', {});
    s.storeName = $('setName').value.trim() || 'NOIR';
    s.currency = $('setCurrency').value.trim() || 'ر.س';
    s.adminPass = $('setPass').value || '1234';
    DB.set('settings', s);
    toast('تم الحفظ ✓', 'ok');
    Admin.render();
  },

  factoryReset() {
    if (!confirm('حذف جميع البيانات نهائياً؟')) return;
    if (!confirm('تأكيد أخير: لا يمكن التراجع!')) return;
    Object.keys(localStorage).filter(k => k.startsWith('noir_')).forEach(k => localStorage.removeItem(k));
    toast('تم الحذف، جاري إعادة التحميل...');
    setTimeout(() => location.reload(), 1000);
  }
};

// ==================== Studio (AI Image Editor) ====================
const Studio = {
  img: null,
  settings: { bright: 100, contrast: 100, sat: 100, rot: 0, bg: '#101722' },
  canvas: null, ctx: null,

  init() {
    this.canvas = $('studioCanvas');
    if (!this.canvas) return;
    this.ctx = this.canvas.getContext('2d');
    $('studioUpload').onchange = (e) => {
      const f = e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        const im = new Image();
        im.onload = () => {
          this.img = im;
          $('studioEditor').style.display = 'grid';
          this.redraw();
        };
        im.src = r.result;
      };
      r.readAsDataURL(f);
    };
    ['bright','contrast','sat','rot'].forEach(k => {
      const el = $('s' + k.charAt(0).toUpperCase() + k.slice(1));
      if (el) el.oninput = (e) => {
        this.settings[k] = +e.target.value;
        const label = $('v' + k.charAt(0).toUpperCase() + k.slice(1));
        if (label) label.textContent = e.target.value + (k==='rot'?'°':'%');
        this.redraw();
      };
    });
    document.querySelectorAll('.bg-swatch').forEach(sw => {
      sw.onclick = () => {
        document.querySelectorAll('.bg-swatch').forEach(s => s.classList.remove('active'));
        sw.classList.add('active');
        this.settings.bg = sw.dataset.bg;
        this.redraw();
      };
    });
  },

  redraw() {
    if (!this.img) return;
    const s = this.settings;
    const max = 500;
    const scale = Math.min(1, max / this.img.width);
    const w = this.img.width * scale, h = this.img.height * scale;
    const rad = s.rot * Math.PI / 180;
    const cw = Math.ceil(Math.abs(w*Math.cos(rad)) + Math.abs(h*Math.sin(rad)));
    const ch = Math.ceil(Math.abs(w*Math.sin(rad)) + Math.abs(h*Math.cos(rad)));
    this.canvas.width = cw; this.canvas.height = ch;
    this.ctx.fillStyle = s.bg;
    this.ctx.fillRect(0, 0, cw, ch);
    this.ctx.save();
    this.ctx.translate(cw/2, ch/2);
    this.ctx.rotate(rad);
    this.ctx.filter = 'brightness(' + s.bright + '%) contrast(' + s.contrast + '%) saturate(' + s.sat + '%)';
    this.ctx.drawImage(this.img, -w/2, -h/2, w, h);
    this.ctx.restore();
  },

  save() {
    if (!this.img) return toast('ارفع صورة أولاً', 'err');
    const dataUrl = this.canvas.toDataURL('image/jpeg', 0.9);
    navigator.clipboard && navigator.clipboard.writeText(dataUrl).catch(()=>{});
    App.showModal(
      '<button class="close-x" onclick="App.closeModal()">✕</button>' +
      '<h2 class="product-title" style="margin-bottom:14px">الصورة المحفوظة</h2>' +
      '<img src="' + dataUrl + '" style="width:100%;border-radius:12px;margin-bottom:14px">' +
      '<p style="color:var(--gray);font-size:12px;margin-bottom:14px">الصورة بصيغة base64. استخدم رابطها في المنتج، أو حمّلها من الزر أدناه.</p>' +
      '<a href="' + dataUrl + '" download="product-' + Date.now() + '.jpg" class="btn-full" style="display:flex;align-items:center;justify-content:center;text-decoration:none;background:var(--gold);color:var(--black)">تحميل الصورة ⬇</a>' +
      '<button class="btn-outline" onclick="App.closeModal()">إغلاق</button>'
    );
  }
};
