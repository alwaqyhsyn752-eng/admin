<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOIR | لوحة الإدارة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--black:#101722;--navy:#1B2938;--gold:#C6A66A;--ivory:#F1EBDD;--emerald:#527D70;--gray:#A5ABB4;--line:rgba(198,166,106,0.18);--card:rgba(27,41,56,0.55)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',sans-serif;background:#0a1018;background-image:radial-gradient(circle at 50% 0%,#1B2938 0%,#101722 55%,#0a1018 100%);color:var(--ivory);direction:rtl;min-height:100vh;line-height:1.6}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit}
a{text-decoration:none;color:inherit}
.header{position:sticky;top:0;z-index:100;background:rgba(16,23,34,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);padding:14px 16px}
.header-top{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:40px;height:40px;border-radius:11px;background:var(--gold);display:grid;place-items:center;font-size:18px;font-weight:900;color:var(--black)}
.brand-name{font-size:16px;font-weight:800} .brand-tag{font-size:9px;color:var(--gold)}
.icon-btn{width:42px;height:42px;border-radius:11px;background:rgba(198,166,106,0.08);border:1px solid var(--line);display:grid;place-items:center;color:var(--gold);text-decoration:none}
.admin-wrap{padding:16px;max-width:900px;margin:0 auto}
.admin-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.admin-title{font-size:20px;font-weight:900;color:var(--gold)}
.admin-tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px;scrollbar-width:none}
.admin-tabs::-webkit-scrollbar{display:none}
.admin-tab{padding:9px 16px;background:rgba(27,41,56,0.6);border:1px solid var(--line);border-radius:10px;color:var(--gray);font-size:12px;font-weight:700;white-space:nowrap;transition:.2s}
.admin-tab.active{background:var(--gold);color:var(--black);border-color:var(--gold)}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.stat-label{font-size:11px;color:var(--gray);margin-bottom:6px}
.stat-val{font-size:22px;font-weight:900;color:var(--gold)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.panel h3{font-size:14px;color:var(--gold);margin-bottom:12px;font-weight:800}
.row-item{display:flex;gap:10px;align-items:center;background:rgba(16,23,34,0.5);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.row-item img{width:48px;height:48px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--black)}
.row-info{flex:1;min-width:0}
.row-title{font-size:13px;font-weight:700;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:11px;color:var(--gray)}
.btn-sm{padding:7px 12px;border-radius:8px;font-size:11px;font-weight:700;transition:.2s}
.btn-edit{background:rgba(198,166,106,0.12);color:var(--gold);border:1px solid var(--gold)}
.btn-del{background:rgba(231,76,60,0.12);color:#e74c3c;border:1px solid #e74c3c}
.btn-ok{background:var(--emerald);color:#fff} .btn-gold{background:var(--gold);color:var(--black)}
.form-group{margin-bottom:14px} .form-label{display:block;font-size:12px;font-weight:700;color:var(--gold);margin-bottom:6px}
.form-input{width:100%;padding:12px 14px;background:rgba(16,23,34,0.7);border:1px solid var(--line);border-radius:10px;color:var(--ivory);font-size:14px}
textarea.form-input{resize:vertical;min-height:70px}
select.form-input{cursor:pointer}
.btn-full{width:100%;height:46px;background:var(--gold);color:var(--black);border-radius:10px;font-weight:800;font-size:14px;margin-top:8px;transition:.2s}
.btn-full:hover{background:#b59559}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(6px);z-index:300;display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.modal-box{background:linear-gradient(180deg,var(--navy) 0%,var(--black) 100%);border-top:1px solid var(--gold);border-radius:24px 24px 0 0;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;padding:22px}
.close-x{display:block;margin-left:auto;width:36px;height:36px;background:rgba(198,166,106,0.1);border-radius:50%;color:var(--gold);font-size:18px;margin-bottom:8px}
.lock-wrap{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lock-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 22px;max-width:380px;width:100%;text-align:center}
.lock-icon{width:60px;height:60px;background:rgba(198,166,106,0.1);border-radius:16px;display:grid;place-items:center;margin:0 auto 14px;color:var(--gold)}
.lock-icon svg{width:28px;height:28px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--gold);color:var(--black);padding:12px 22px;border-radius:24px;font-weight:700;font-size:13px;opacity:0;pointer-events:none;transition:all .3s;z-index:1000;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.err{background:#e74c3c;color:#fff} .toast.ok{background:var(--emerald);color:#fff}
.file-input{width:100%;padding:12px;background:rgba(16,23,34,0.7);border:1px dashed var(--gold);border-radius:10px;color:var(--ivory);cursor:pointer}
.footer-credit{text-align:center;padding:20px;font-size:11px;color:var(--gray);border-top:1px solid var(--line);margin-top:30px}
</style>
</head>
<body>
<div class="header">
  <div class="header-top">
    <div class="brand"><div class="brand-mark">A</div><div><span class="brand-name">لوحة الإدارة</span><span class="brand-tag">Admin Panel</span></div></div>
    <a href="../store/index.html" class="icon-btn" title="عرض المتجر">🏠</a>
  </div>
</div>
<div id="adminContent"></div>
<div class="footer-credit">📞 تطوير: حسين غلاب الخلاقي - 738990668</div>
<div class="modal" id="genericModal" onclick="if(event.target===this)App.closeModal()"><div class="modal-box" id="genericBox"></div></div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://lihjllkvejczarfsqxxy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_9fc0c5toY2CrschBTH2kug_-k5Qtp60';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const STORE_ID = new URLSearchParams(window.location.search).get('store') || localStorage.getItem('active_store') || 'default';

const $ = id => document.getElementById(id);
function toast(msg,type){
  const t=$('toast'); t.textContent=msg; t.className='toast show '+(type||'');
  clearTimeout(t._t); t._t=setTimeout(()=>{t.className='toast'},2800);
}

const App = {
  closeModal(){$('genericModal').classList.remove('open')},
  showModal(html){$('genericBox').innerHTML=html;$('genericModal').classList.add('open')}
};

const Admin = {
  authed:false, tab:'dashboard',
  render(){ if(!this.authed) return this.showLock(); this.renderPanel(); },
  
  showLock(){
    $('adminContent').innerHTML='<div class="lock-wrap"><div class="lock-box"><div class="lock-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div><h2 style="font-size:18px;font-weight:800;text-align:center;margin-bottom:6px">لوحة الإدارة</h2><p style="color:var(--gray);font-size:12px;text-align:center;margin-bottom:16px">كلمة المرور الافتراضية: 1234</p><div class="form-group"><input class="form-input" type="password" id="adminPass" placeholder="••••"></div><button class="btn-full" onclick="Admin.unlock()">دخول</button></div></div>';
  },
  
  async unlock(){
    const p = $('adminPass').value;
    const { data } = await supabaseClient.from('settings').select('*').eq('store_id',STORE_ID).limit(1);
    const adminPass = (data && data[0]) ? data[0].admin_pass : '1234';
    if(p === adminPass){ this.authed=true; this.renderPanel(); }
    else toast('كلمة المرور خاطئة','err');
  },
  
  async renderPanel(){
    const { data: prods } = await supabaseClient.from('products').select('*').eq('store_id',STORE_ID);
    const { data: orders } = await supabaseClient.from('orders').select('*, order_items(*)').eq('store_id',STORE_ID).order('created_at',{ascending:false});
    const { data: users } = await supabaseClient.from('users').select('*').eq('store_id',STORE_ID);
    
    const stats = { products: (prods||[]).length, orders: (orders||[]).length, users: (users||[]).length, revenue: (orders||[]).reduce((s,o)=>s+(o.total||0),0) };
    
    $('adminContent').innerHTML = '<div class="admin-wrap"><div class="admin-head"><h1 class="admin-title">مرحباً بك</h1><button class="btn-sm btn-gold" onclick="Admin.authed=false;Admin.render()">خروج</button></div><div class="admin-tabs">'+
      ['dashboard|📊 الملخص','products|📦 المنتجات','categories|📂 الأقسام','orders|🛒 الطلبات','users|👥 العملاء','settings|⚙️ الإعدادات'].map(t=>{
        const[k,l]=t.split('|'); return '<button class="admin-tab '+(this.tab===k?'active':'')+'" onclick="Admin.tab=\''+k+'\';Admin.renderPanel()">'+l+'</button>';
      }).join('')+'</div><div id="adminTabContent"></div></div>';
    
    this.renderTabContent(stats, prods, orders, users);
  },
  
  renderTabContent(stats, prods, orders, users){
    const c = $('adminTabContent');
    if(this.tab==='dashboard'){
      c.innerHTML = '<div class="stat-grid"><div class="stat"><div class="stat-label">المنتجات</div><div class="stat-val">'+stats.products+'</div></div><div class="stat"><div class="stat-label">الطلبات</div><div class="stat-val">'+stats.orders+'</div></div><div class="stat"><div class="stat-label">العملاء</div><div class="stat-val">'+stats.users+'</div></div><div class="stat"><div class="stat-label">الإيراد</div><div class="stat-val">'+stats.revenue+'</div></div></div>';
    }
    if(this.tab==='products'){
      c.innerHTML = '<div class="panel"><div style="display:flex;justify-content:space-between;margin-bottom:12px"><h3 style="margin:0">المنتجات ('+(prods||[]).length+')</h3><button class="btn-sm btn-gold" onclick="Admin.newProduct()">+ إضافة</button></div>'+(prods||[]).map(p=>'<div class="row-item"><img src="'+(p.image_url||'https://via.placeholder.com/50')+'"><div class="row-info"><div class="row-title">'+p.name+'</div><div class="row-sub">'+p.price+' ر.س • مخزون: '+(p.stock||0)+'</div></div><button class="btn-sm btn-edit" onclick="Admin.editProduct(\''+p.id+'\')">تعديل</button><button class="btn-sm btn-del" onclick="Admin.delProduct(\''+p.id+'\')">حذف</button></div>').join('')+'</div>';
    }
    if(this.tab==='categories'){ this.renderCategoriesTab(c); return; }
    if(this.tab==='orders'){
      c.innerHTML = '<div class="panel"><h3>الطلبات ('+(orders||[]).length+')</h3>'+(orders||[]).map(o=>{
        const loc = (o.location_lat && o.location_lng) ? '<a href="https://www.google.com/maps?q='+o.location_lat+','+o.location_lng+'" target="_blank" style="color:#527D70;font-size:11px">📍 موقع العميل</a>' : '<span style="color:var(--gray);font-size:11px">📍 لا يوجد موقع</span>';
        const items = (o.order_items||[]).map(i=>'<div style="font-size:11px;color:var(--gray)">• '+i.product_name+' × '+i.quantity+'</div>').join('');
        return '<div class="row-item" style="flex-direction:column;align-items:flex-start;padding:12px;margin-bottom:10px"><div style="width:100%;display:flex;justify-content:space-between;margin-bottom:6px"><div class="row-title">طلب #'+o.id.slice(-6)+'</div><select onchange="Admin.updateOrderStatus(\''+o.id+'\',this.value)" class="form-input" style="width:auto;padding:4px 8px;font-size:11px"><option '+(o.status==='جديد'?'selected':'')+'>جديد</option><option '+(o.status==='مكتمل'?'selected':'')+'>مكتمل</option></select></div><div style="color:var(--gold);font-weight:700">👤 '+o.customer_name+'</div><div style="color:var(--ivory);font-size:12px">📱 '+o.phone+'</div><div style="color:var(--gray);font-size:11px">🏠 '+o.address+'</div>'+loc+'<div style="width:100%;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)">'+items+'</div><div style="color:var(--gold);font-weight:800;margin-top:6px">'+o.total+' ر.س</div></div>';
      }).join('')+'</div>';
    }
    if(this.tab==='users'){
      c.innerHTML = '<div class="panel"><h3>العملاء ('+(users||[]).length+')</h3>'+(users||[]).map(u=>'<div class="row-item"><div class="row-info"><div class="row-title">'+u.full_name+'</div><div class="row-sub">'+u.email+' • '+u.phone+'</div><div class="row-sub">'+u.neighborhood+'</div></div></div>').join('')+'</div>';
    }
    if(this.tab==='settings'){
      c.innerHTML = '<div class="panel"><h3>إعدادات المتجر</h3><div class="form-group"><label class="form-label">اسم المتجر</label><input class="form-input" id="setName" value="'+STORE_ID+'"></div><div class="form-group"><label class="form-label">كلمة المرور</label><input class="form-input" id="setPass" value="1234"></div><button class="btn-full" onclick="Admin.saveSettings()">حفظ ✓</button></div>';
    }
  },
  
  newProduct(){
    App.showModal('<button class="close-x" onclick="App.closeModal()">✕</button><h2 style="font-size:18px;font-weight:800;margin-bottom:14px">منتج جديد</h2><div class="form-group"><label class="form-label">الاسم</label><input class="form-input" id="pfName"></div><div class="form-group"><label class="form-label">السعر</label><input class="form-input" id="pfPrice" type="number"></div><div class="form-group"><label class="form-label">الوصف</label><textarea class="form-input" id="pfDesc"></textarea></div><div class="form-group"><label class="form-label">صورة المنتج</label><input type="file" id="pfImageFile" accept="image/*" class="file-input"></div><button class="btn-full" onclick="Admin.saveProduct()">حفظ ✓</button>');
  },
  
  editProduct(id){ App.showModal('<h2>تعديل المنتج</h2><p style="color:var(--gray);text-align:center;padding:20px;">سيتم إضافة التعديل قريباً</p><button class="close-x" onclick="App.closeModal()">✕</button>'); },
  
  async saveProduct(id){
    const name = $('pfName').value.trim();
    const price = parseFloat($('pfPrice').value) || 0;
    if(!name || !price) return toast('الاسم والسعر مطلوبان','err');
    
    let imgUrl = null;
    const fileInput = $('pfImageFile');
    if(fileInput && fileInput.files[0]){
      toast('جاري رفع الصورة...');
      const fileName = 'p_'+Date.now()+'_'+fileInput.files[0].name;
      const { error } = await supabaseClient.storage.from('product-images').upload(fileName, fileInput.files[0]);
      if(!error){
        const { data } = supabaseClient.storage.from('product-images').getPublicUrl(fileName);
        imgUrl = data.publicUrl;
      }
    }
    
    const { error } = await supabaseClient.from('products').insert([{
      name, price, description: $('pfDesc').value, image_url: imgUrl, store_id: STORE_ID
    }]);
    
    if(error) { console.error('PRODUCT SAVE ERROR:', error); return toast('فشل: ' + error.message, 'err'); }
    toast('تم الحفظ ✓','ok');
    App.closeModal();
    this.renderPanel();
  },
  
  async delProduct(id){ if(confirm('حذف؟')){ await supabaseClient.from('products').delete().eq('id',id); this.renderPanel(); } },
  
  async updateOrderStatus(id,status){ await supabaseClient.from('orders').update({status}).eq('id',id); toast('تم التحديث ✓','ok'); },
  

  async renderCategoriesTab(c){
    const { data: cats, error } = await supabaseClient.from('categories').select('*').eq('store_id',STORE_ID).order('sort_order');
    if(error) console.error(error);
    c.innerHTML = '<div class="panel"><div style="display:flex;justify-content:space-between;margin-bottom:12px"><h3 style="margin:0">الأقسام ('+(cats||[]).length+')</h3><button class="btn-sm btn-gold" onclick="Admin.newCategory()">+ إضافة قسم</button></div>'+
      ((cats||[]).length ? cats.map(cat=>'<div class="row-item"><div class="row-info"><div class="row-title">'+(cat.icon||'📁')+' '+cat.name+'</div></div><button class="btn-sm btn-del" onclick="Admin.delCategory(\''+cat.id+'\')">حذف</button></div>').join('') : '<p style="color:var(--gray);text-align:center;padding:20px">لا توجد أقسام</p>')+'</div>';
  },
  
  newCategory(){
    App.showModal('<button class="close-x" onclick="App.closeModal()">✕</button><h2 style="font-size:18px;font-weight:800;margin-bottom:14px">قسم جديد</h2><div class="form-group"><label class="form-label">الاسم</label><input class="form-input" id="catName" placeholder="مثال: ساعات"></div><div class="form-group"><label class="form-label">الأيقونة (اختياري)</label><input class="form-input" id="catIcon" placeholder="⌚" maxlength="2"></div><button class="btn-full" onclick="Admin.saveCategory()">حفظ ✓</button>');
  },
  
  async saveCategory(){
    const name = $('catName').value.trim();
    const icon = $('catIcon').value.trim() || '📁';
    if(!name) return toast('الاسم مطلوب','err');
    const { error } = await supabaseClient.from('categories').insert([{ name, icon, store_id: STORE_ID }]);
    if(error) return toast('فشل: ' + error.message, 'err');
    toast('تم حفظ القسم ✓','ok');
    App.closeModal();
    this.renderPanel();
  },
  
  async delCategory(id){
    if(!confirm('حذف القسم؟')) return;
    const { error } = await supabaseClient.from('categories').delete().eq('id', id);
    if(error) return toast('فشل: ' + error.message, 'err');
    toast('تم الحذف ✓','ok');
    this.renderPanel();
  },

    async saveSettings(){
    await supabaseClient.from('settings').upsert({store_id:STORE_ID, store_name:$('setName').value, admin_pass:$('setPass').value});
    toast('تم الحفظ ✓','ok');
  }
};

document.addEventListener('DOMContentLoaded', () => Admin.render());
window.App = App; window.Admin = Admin;
</script>
</body>
</html>
