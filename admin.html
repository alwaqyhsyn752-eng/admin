<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>الإدارة</title>
<style>
:root{--gold:#d4af37;--bg:#0b0d1a;--card:#1f2141;--text:#f0f0f5;--muted:#9a9ab0;--border:rgba(212,175,55,0.2)}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}body{background:var(--bg);color:var(--text);direction:rtl;padding:15px}
h2{color:var(--gold);margin-bottom:15px;text-align:center}
.tabs{display:flex;gap:5px;margin-bottom:20px;overflow-x:auto}
.tabs button{padding:8px 15px;background:var(--card);border:1px solid var(--border);color:#fff;border-radius:8px;white-space:nowrap;cursor:pointer}
.tabs button.active{background:var(--gold);color:#000;font-weight:bold}
.panel{background:var(--card);padding:15px;border-radius:12px;border:1px solid var(--border);margin-bottom:15px}
input,textarea{width:100%;padding:10px;margin-bottom:10px;background:#000;border:1px solid var(--border);color:#fff;border-radius:8px}
.btn{width:100%;padding:10px;background:var(--gold);color:#000;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.row{display:flex;gap:10px}.row input{flex:1}
.item{background:#121429;padding:10px;border-radius:8px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border)}
.preview{padding:20px;border-radius:10px;text-align:center;margin-bottom:15px;border:1px solid var(--border)}
.colors{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>
</head>
<body>
<h2>لوحة الإدارة</h2>
<div class="tabs">
  <button class="active" onclick="Admin.tab('products',this)">المنتجات</button>
  <button onclick="Admin.tab('users',this)">العملاء</button>
  <button onclick="Admin.tab('design',this)">التصميم</button>
</div>
<div id="content"></div>

<script>
const urlParams = new URLSearchParams(window.location.search);
let storeId = urlParams.get('store') || 'default';
const DB = {
  get: (k) => JSON.parse(localStorage.getItem('store_'+storeId+'_'+k)) || [],
  set: (k,v) => localStorage.setItem('store_'+storeId+'_'+k, JSON.stringify(v)),
  getSettings: () => JSON.parse(localStorage.getItem('store_'+storeId+'_settings')) || {bg1:'#0b0d1a',bg2:'#1a1035',card:'#1f2141',primary:'#d4af37'},
  setSettings: (s) => localStorage.setItem('store_'+storeId+'_settings', JSON.stringify(s))
};

const Admin = {
  tab(t, btn) {
    document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active')); btn.classList.add('active');
    if(t==='products') this.products(); if(t==='users') this.users(); if(t==='design') this.design();
  },
  products() {
    document.getElementById('content').innerHTML = `
      <div class="panel">
        <h3 style="color:var(--gold);margin-bottom:10px">إضافة منتج</h3>
        <input type="text" id="p_name" placeholder="اسم المنتج">
        <div class="row"><input type="number" id="p_price" placeholder="السعر"><input type="number" id="p_old" placeholder="السعر القديم"></div>
        <input type="url" id="p_video" placeholder="رابط فيديو (mp4)">
        <input type="file" id="p_imgs" multiple style="color:#fff">
        <textarea id="p_desc" placeholder="الوصف"></textarea>
        <button class="btn" onclick="Admin.saveProduct()">حفظ المنتج</button>
      </div>
      <h3 style="color:var(--gold);margin-bottom:10px">المنتجات الحالية</h3>
      ${DB.get('products').map(p => `<div class="item"><div>${p.name} - ${p.price}</div><button onclick="Admin.del('${p.id}')" style="color:red;background:none;border:none">حذف</button></div>`).join('')}`;
  },
  saveProduct() {
    let name = document.getElementById('p_name').value; let price = document.getElementById('p_price').value;
    if(!name || !price) return alert('الاسم والسعر مطلوبان');
    let prods = DB.get('products');
    prods.push({ id:'p'+Date.now(), name, price, oldPrice:document.getElementById('p_old').value||null, video:document.getElementById('p_video').value, desc:document.getElementById('p_desc').value, images:['https://picsum.photos/400/400?random='+Math.random()] });
    DB.set('products', prods); this.products(); alert('تم الحفظ');
  },
  del(id) { if(confirm('حذف؟')) { DB.set('products', DB.get('products').filter(p=>p.id!==id)); this.products(); } },
  users() {
    document.getElementById('content').innerHTML = DB.get('users').map(u => `
      <div class="item" style="flex-direction:column;align-items:flex-start;gap:10px">
        <div><b style="color:var(--gold)">${u.name}</b> (${u.email})</div>
        ${u.location ? `<a href="https://maps.google.com/?q=${u.location.lat},${u.location.lng}" target="_blank" style="color:green;font-size:12px">📍 موقع العميل</a>` : ''}
        <button onclick="Admin.block('${u.email}', ${!!u.blocked})" style="background:${u.blocked?'green':'red'};color:#fff;padding:5px 10px;border:none;border-radius:5px">${u.blocked?'إلغاء الحظر':'حظر'}</button>
      </div>`).join('') || 'لا يوجد عملاء';
  },
  block(email, blocked) {
    let users = DB.get('users'); let u = users.find(x=>x.email===email); if(u) { u.blocked = !blocked; DB.set('users', users); this.users(); }
  },
  design() {
    let s = DB.getSettings();
    document.getElementById('content').innerHTML = `
      <div class="preview" id="preview" style="background:linear-gradient(135deg,${s.bg1},${s.bg2})">
        <h3 style="color:${s.primary}">معاينة حية</h3><div style="background:${s.card};padding:10px;border-radius:8px;color:#fff;margin-top:10px">بطاقة منتج</div>
      </div>
      <div class="panel">
        <div class="colors">
          <div><label>خلفية 1</label><input type="color" id="c_bg1" value="${s.bg1}" oninput="Admin.prev()"></div>
          <div><label>خلفية 2</label><input type="color" id="c_bg2" value="${s.bg2}" oninput="Admin.prev()"></div>
          <div><label>البطاقة</label><input type="color" id="c_card" value="${s.card}" oninput="Admin.prev()"></div>
          <div><label>الأساسي</label><input type="color" id="c_primary" value="${s.primary}" oninput="Admin.prev()"></div>
        </div>
        <button class="btn" style="margin-top:15px" onclick="Admin.saveDesign()">حفظ التصميم</button>
      </div>`;
  },
  prev() {
    let bg1 = document.getElementById('c_bg1').value; let bg2 = document.getElementById('c_bg2').value; let card = document.getElementById('c_card').value; let pri = document.getElementById('c_primary').value;
    let p = document.getElementById('preview'); p.style.background = `linear-gradient(135deg,${bg1},${bg2})`; p.querySelector('h3').style.color = pri; p.querySelector('div').style.background = card;
  },
  saveDesign() {
    DB.setSettings({ bg1:document.getElementById('c_bg1').value, bg2:document.getElementById('c_bg2').value, card:document.getElementById('c_card').value, primary:document.getElementById('c_primary').value });
    alert('تم الحفظ!'); 
  }
};
Admin.products();
</script>
</body>
</html>
